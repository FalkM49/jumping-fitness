# Иконка приложения на всех платформах. Исходники рисует tool/make_icon.ps1.
# Обновить: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  # Адаптивная иконка (Android 8+): лепесток с «JF» поверх тёмного фона,
  # лаунчер сам обрежет её в круг, квадрат или «каплю».
  adaptive_icon_background: "#1C1418"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1C1418"
    theme_color: "#C81E5E"
