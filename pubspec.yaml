name: jumping_fitness
description: "Jumping Fitness — запись на групповые тренировки и учёт абонементов."
publish_to: "none"

version: 0.1.0+1

environment:
  # Минимум задан самой новой зависимостью (flutter_riverpod 3.4 → Dart 3.12,
  # что соответствует Flutter 3.44). Рекомендуемая версия — текущий stable 3.47.x.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Firebase (раздел 10 ТЗ) ---
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.4.0
  firebase_messaging: ^16.7.0

  # --- Состояние ---
  flutter_riverpod: ^3.4.3

  # --- Оформление ---
  google_fonts: ^8.2.1

  # --- Локальное хранение настроек (выбор темы) ---
  shared_preferences: ^2.5.5
  # Веб-версия для iPhone: открыт ли сайт как приложение с экрана «Домой».
  web: ^1.1.1

  # --- Форматирование дат на русском (версию фиксирует flutter_localizations) ---
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
