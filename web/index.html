<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Путь приложения; подставляется `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover: на iPhone с «чёлкой» приложение занимает весь
       экран, отступы под вырез и полоску «Домой» даёт SafeArea. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jumping Fitness — запись на тренировки и абонемент.">

  <!-- Установка на экран «Домой» (iPhone: Поделиться → На экран «Домой»). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jumping Fitness">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#C81E5E">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Jumping Fitness</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Пока грузится Flutter — фон и название, а не белый экран. */
    html, body { margin: 0; height: 100%; background: #1C1418; }
    @media (prefers-color-scheme: light) { html, body { background: #FFF8FA; } }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 600 22px -apple-system, system-ui, sans-serif; color: #C81E5E;
    }
    /* Safari не должен двигать саму страницу под Flutter (клавиатура,
       «оттягивание»), а двойной тап — увеличивать её (docs/09, шаг 5). */
    html, body {
      position: fixed; inset: 0; overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="loading">Jumping Fitness</div>
  <script>
    // Клавиатура закрылась (видимая область снова во всю высоту окна), а
    // Safari оставил страницу сдвинутой — возвращаем её на место. Иначе
    // нажатия попадают мимо кнопок (docs/09, шаг 5).
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      vv.addEventListener('resize', function () {
        if (Math.abs(vv.height - window.innerHeight) < 1) window.scrollTo(0, 0);
      });
    })();

    // Возврат после сворачивания (docs/09, шаг 6).
    (function () {
      // Safari может отобрать у страницы WebGL-контекст — сообщаем в журнал
      // ошибок (его слушает Dart: lib/services/web_session_web.dart).
      // Холсты Flutter могут лежать в shadow DOM, поэтому обходим и его.
      function watchCanvases(root) {
        root.querySelectorAll('*').forEach(function (el) {
          if (el.tagName === 'CANVAS' && !el.__jfWatched) {
            el.__jfWatched = true;
            el.addEventListener('webglcontextlost', function () {
              window.dispatchEvent(new CustomEvent('jf-webgl-lost'));
            });
          }
          if (el.shadowRoot) watchCanvases(el.shadowRoot);
        });
      }
      // Не чаще раза в полсекунды: обход DOM недешёвый.
      var scanTimer = null;
      new MutationObserver(function () {
        if (scanTimer) return;
        scanTimer = setTimeout(function () {
          scanTimer = null;
          watchCanvases(document);
        }, 500);
      }).observe(document.documentElement, { childList: true, subtree: true });

      // Вкладка была скрыта дольше 10 минут — перезагружаем: данные живут
      // в Firestore, вход сохранён, а «уснувшие» подписки и потерянная
      // отрисовка так гарантированно восстанавливаются. Это обычная
      // перезагрузка: pagehide снимет метку, unexpected_reload не будет.
      var hiddenAt = null;
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          hiddenAt = Date.now();
        } else if (hiddenAt !== null) {
          var away = Date.now() - hiddenAt;
          hiddenAt = null;
          if (away > 10 * 60 * 1000) location.reload();
        }
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
